name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test di integrità del sito statico
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Nessuna dipendenza npm: i test usano solo la libreria standard di Node.
      - name: Sanitizzazione URL (assistente.js)
        run: node tests/test-sanitize-url.js

      - name: Collegamenti interni e asset locali
        run: node tests/test-links.js

      - name: Invarianti HTML/CSS (Puter, var(--border), h1)
        run: node tests/test-html-invariants.js

      - name: Struttura semantica (h1/main, breadcrumb, skip-link)
        run: node tests/test-struttura.js

      - name: Accessibilità tabelle (region, caption, scope)
        run: node tests/test-tabelle.js

      - name: Coerenza date dossier (dateModified = git)
        run: node tools/aggiorna-date-dossier.js --check
